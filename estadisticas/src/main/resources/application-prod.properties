spring.config.activate.on-profile=prod

spring.application.name=estadisticas

# Config puerto
server.port=8085
# port tiene que ser un env

# Muestra los logs de tu paquete específico
logging.level.ar.utn.ba.ddsi.estadisticas=DEBUG

# O para ver todos los logs de tu aplicación, incluyendo los de frameworks
# logging.level.root=DEBUG

##Configuración de la Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/estadisticas?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
# url tiene que ser un env
spring.datasource.username=${DISENO_DB_USERNAME}
spring.datasource.password=${DISENO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##Configuración de Sincronización de entities con la base de datos
spring.jpa.hibernate.ddl-auto=update
# none: no toca la bd
# validate: valida que las entidades coincidan con la bd
# update: actualiza la BD segun las entidades (muy usado en desarrollo)
# create: crea las tablas en cada inicio
# create-drop: igual que create pero borra al apagar

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

management.endpoint.health.show-details=never
spring.main.banner-mode=off
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MetaMapa - Crear Cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/registro.css}">
  <link rel="icon" type="image/png" th:href="@{/images/metamapa-icon.png}">
</head>

<body>
  <div class="signup-container">
    <!-- Header -->
    <div class="logo-container">
      <div class="logo">MetaMapa</div>
      <p class="logo-subtitle">Sistema de Gestión de Mapeos</p>
    </div>

    <div class="form-header">
      <h1 class="form-title">Crear cuenta</h1>
    </div>

    <!-- Formulario -->
    <form id="signupForm" th:action="@{/registro}" th:object="${usuario}" method="post">
      <!-- Email -->
      <div class="form-group">
        <input type="email" class="form-input" th:field="*{email}" placeholder="Correo electrónico" required>
        <span class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>

      <!-- Nombre -->
      <div class="form-group">
        <input type="text" class="form-input" th:field="*{nombre}" placeholder="Nombre completo" required>
        <span class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <input type="password" class="form-input" th:field="*{password}" placeholder="Contraseña nueva" required>
        <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </div>

      <!-- Edad -->
      <div class="form-group">
        <label class="birthday-label" for="edad">Edad</label>
        <input type="number" id="edad" th:field="*{edad}" class="birthday-select" min="13" max="120" required>
        <span class="error-message" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></span>
      </div>

      <!-- Términos -->
      <p class="terms-text">
        Al hacer clic en "Registrarse", aceptas nuestros<br>
        <a th:href="@{/acerca}" class="terms-link">Términos y Condiciones</a>
      </p>

      <!-- Botón -->
      <button type="submit" class="signup-btn">Registrarse</button>
    </form>

    <!-- Enlace para iniciar sesión -->
    <div class="login-link-container">
      <a th:href="@{/login}" class="login-link">¿Ya tienes una cuenta?</a>
    </div>
  </div>

  <script th:src="@{/js/registro.js}"></script>
</body>

</html>

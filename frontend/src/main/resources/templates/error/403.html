<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMapa - Error 403</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/metamapa-icon.png}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body class="error">
<!-- BARRA DE NAVEGACION -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- CONTENIDO ERROR 403 -->
<div class="error-container">
    <h1 class="error-code">403</h1>
    <h2 class="error-title">¡Acceso prohibido!</h2>
    <p class="error-message">
        No tienes permisos para acceder a esta página. Si crees que esto es un error, contacta al administrador.
    </p>

    <img class="error-image" th:src="@{/images/403.jpg}" alt="Error 403">

    <a th:href="@{/}" class="btn-home">Volver al inicio</a>
</div>

<!-- FOOTER -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
